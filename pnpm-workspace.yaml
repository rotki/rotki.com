saveExact: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@rotki/eslint-config'
  - '@rotki/eslint-plugin'
  - '@rotki/ui-library'
shamefullyHoist: true
shellEmulator: true
blockExoticSubdeps: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
  - undici-types@6.19.8
  - '@noble/curves@1.8.0'
  - '@noble/hashes@1.7.0'
  - slow-redact@0.3.2
  - synckit@0.9.3
  - tailwind-merge@2.6.1

packages:
  - .
  - packages/*
  - packages/website/tests/e2e/mock-api

overrides:
  chokidar: 5.0.0
  # stylelint-order 8.1.1 (newest) declares `postcss: ^8.5.8`, and pnpm will not
  # re-resolve a range that is already satisfied, so it pinned a second, vulnerable
  # copy at 8.5.15 that kept GHSA-r28c-9q8g-f849 and GHSA-fxqj-rqcc-2cmp open.
  # Force a single copy until stylelint-order widens or we drop it.
  postcss: 8.5.24

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  bufferutil: true
  esbuild: true
  msw: false
  sharp: false
  utf-8-validate: true
  vue-demi: false

patchedDependencies:
  '@types/paypal-checkout-components@4.0.8': patches/@types__paypal-checkout-components@4.0.8.patch
