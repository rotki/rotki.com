blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@rotki/eslint-config'
  - '@rotki/eslint-plugin'
  - '@rotki/ui-library'
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - '@noble/curves@1.8.0'
  - '@noble/hashes@1.7.0'
  - slow-redact@0.3.2
  - tailwind-merge@2.6.1
shamefullyHoist: true
shellEmulator: true
strictDepBuilds: true
saveExact: true

packages:
  - .
  - packages/*
  - packages/website/tests/e2e/mock-api

overrides:
  # tailwindcss 3 still asks for chokidar ^3.6.0 while everything else is on ^5.
  # Keep a single copy instead of a second chokidar tree for tailwind alone.
  chokidar: 5.0.0
  # stylelint-order 8.1.1 (newest) declares `postcss: ^8.5.8`, and pnpm will not
  # re-resolve a range that is already satisfied, so it pinned a second, vulnerable
  # copy at 8.5.15 that kept GHSA-r28c-9q8g-f849 and GHSA-fxqj-rqcc-2cmp open.
  # Force a single copy until stylelint-order widens or we drop it.
  postcss: 8.5.28
  # jsdom 28.1.0 (a test-tooling peer) allows undici ^7.21.0, but pnpm kept the
  # vulnerable 7.27.2 it had already resolved. Pin the 7.x line to a patched
  # release until jsdom moves on.
  undici@^7: 7.29.1

patchedDependencies:
  '@types/paypal-checkout-components@4.0.8': patches/@types__paypal-checkout-components@4.0.8.patch

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  msw: false
  vue-demi: false

