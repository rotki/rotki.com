trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - '@noble/curves@1.8.0'
  - '@noble/hashes@1.7.0'
  - slow-redact@0.3.2

shamefullyHoist: true
shellEmulator: true
strictDepBuilds: true
saveExact: true

packages:
  - .
  - packages/*
  - packages/website/tests/e2e/mock-api

overrides:
  # GHSA-px8p-9vwx-vf98: satori's @shuding/opentype.js allows ^0.7.3, but pnpm
  # (install and dedupe) keeps the vulnerable 0.7.3. Drop this when satori moves on.
  fflate@^0.7: 0.7.5
  # oxfmt (through @rotki/eslint-config) pins the vulnerable 2.1.0. Drop this when it moves on.
  tinypool@2.1.0: 2.1.2
  # jsdom 28.1.0 (a test-tooling peer) allows undici ^7.21.0, but pnpm kept the
  # vulnerable 7.27.2 it had already resolved. Pin the 7.x line to a patched
  # release until jsdom moves on.
  undici@^7: 7.30.1

patchedDependencies:
  '@types/paypal-checkout-components@4.0.8': patches/@types__paypal-checkout-components@4.0.8.patch

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  msw: false
  vue-demi: false

